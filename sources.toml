# ---------------------------------------------------------------------------
# Finance Cockpit — source definitions
#
# This is the file you edit. Add, remove or reorder [[tile]] blocks and run
# ./refresh.sh (or ask Claude to "refresh the cockpit") to rebuild the board.
#
# Every tile needs:  key, label, group, provider
# Everything else is optional and has a sane default.
#
# Providers:
#   yahoo      — Yahoo Finance chart API. `symbol` is the Yahoo ticker, i.e. the
#                last path segment of https://finance.yahoo.com/quote/<symbol>
#                ("^TNX", "^GSPC", "EURUSD=X", "GC=F"). Also returns an intraday
#                series, so these tiles get a real sparkline immediately.
#   coingecko  — crypto spot. `symbol` is a coingecko id, e.g. "bitcoin".
#   cnbc       — CNBC's public quote service. `symbol` is the CNBC ticker, i.e.
#                the last path segment of https://www.cnbc.com/quotes/<symbol>
#   stooq      — stooq.com CSV endpoint. `symbol` e.g. "eurusd", "^spx".
#   frankfurter— ECB reference rates (FX only). `symbol` e.g. "USD/CHF".
#   derived    — computed from other tiles. Set `expr`, e.g. "us10y - us2y".
#
#   A tile may name a second provider with `alt_provider` / `alt_symbol`, tried
#   only when the first cannot be reached. This is not belt-and-braces: which
#   hosts answer depends on where the build runs, and the two places this board
#   builds see opposite worlds (measured 2026-08-21, see README):
#
#                        GitHub runner   this sandbox
#     cnbc                   200             403 (Akamai)
#     yahoo                  429             429
#     coingecko              200             200
#
#   So tiles lead with CNBC — the scheduled refresh runs in CI, where CNBC
#   works — and fall back to Yahoo, which is what a Claude session relays from.
#
# Formatting:
#   unit      suffix printed after the value ("%", " bp", …)
#   prefix    printed before the value ("$", "€", …)
#   decimals  digits after the point
#   good_when "up" (default) | "down" | "neutral" — controls the up/down colour.
#             "neutral" prints the change in plain ink, for series where a rise
#             is neither good nor bad.
# ---------------------------------------------------------------------------

[cockpit]
title      = "Finance Cockpit"
tagline    = "Rates, risk and the dollar — one screen"
timezone   = "Europe/Zurich"
# Tiles whose data is older than this many minutes are flagged as stale.
stale_after_minutes = 90

# ── Rates ──────────────────────────────────────────────────────────────────

[[tile]]
key      = "us10y"
label    = "US 10-Year Treasury"
group    = "Rates"
provider = "cnbc"
symbol   = "US10Y"
alt_provider = "yahoo"
alt_symbol     = "^TNX"
unit     = "%"
decimals = 3
featured = true
good_when = "neutral"
note     = "The cockpit's anchor rate — discounting everything else on this board."

# No fallback: Yahoo publishes no 2-year yield index (its Treasury indices are
# ^IRX, ^FVX, ^TNX, ^TYX) and the 2-year yield future 2YY=F quotes an expired
# contract. CNBC is the only source with it, so this tile is live in CI and
# relayed everywhere else.
[[tile]]
key      = "us2y"
label    = "US 2-Year Treasury"
group    = "Rates"
provider = "cnbc"
symbol   = "US2Y"
unit     = "%"
decimals = 3
good_when = "neutral"

[[tile]]
key      = "us30y"
label    = "US 30-Year Treasury"
group    = "Rates"
provider = "cnbc"
symbol   = "US30Y"
alt_provider = "yahoo"
alt_symbol     = "^TYX"
unit     = "%"
decimals = 3
good_when = "neutral"

[[tile]]
key       = "curve_2s10s"
label     = "2s10s Curve"
group     = "Rates"
provider  = "derived"
expr      = "(us10y - us2y) * 100"
unit      = " bp"
decimals  = 1
good_when = "neutral"
note      = "10-year minus 2-year, in basis points. Negative means inverted. Only as current as the 2-year leg, which is relayed."

# ── Equities ───────────────────────────────────────────────────────────────

[[tile]]
key      = "spx"
label    = "S&P 500"
group    = "Equities"
provider = "cnbc"
symbol   = ".SPX"
alt_provider = "yahoo"
alt_symbol     = "^GSPC"
decimals = 2

[[tile]]
key      = "ndx"
label    = "Nasdaq Composite"
group    = "Equities"
provider = "cnbc"
symbol   = ".IXIC"
alt_provider = "yahoo"
alt_symbol     = "^IXIC"
decimals = 2

[[tile]]
key      = "dax"
label    = "DAX"
group    = "Equities"
provider = "cnbc"
symbol   = ".GDAXI"
alt_provider = "yahoo"
alt_symbol     = "^GDAXI"
decimals = 2

[[tile]]
key       = "vix"
label     = "VIX"
group     = "Equities"
provider  = "cnbc"
symbol    = ".VIX"
alt_provider = "yahoo"
alt_symbol     = "^VIX"
decimals  = 2
good_when = "down"
note      = "Implied 30-day volatility on the S&P 500."

# ── Currencies & commodities ───────────────────────────────────────────────

[[tile]]
key      = "eurusd"
label    = "EUR / USD"
group    = "Currencies & Commodities"
provider = "cnbc"
symbol   = "EUR="
alt_provider = "yahoo"
alt_symbol     = "EURUSD=X"
decimals = 4
good_when = "neutral"

[[tile]]
key      = "usdchf"
label    = "USD / CHF"
group    = "Currencies & Commodities"
provider = "cnbc"
symbol   = "CHF="
alt_provider = "yahoo"
alt_symbol     = "CHF=X"
decimals = 4
good_when = "neutral"

[[tile]]
key      = "gold"
label    = "Gold"
group    = "Currencies & Commodities"
provider = "cnbc"
symbol   = "@GC.1"
alt_provider = "yahoo"
alt_symbol     = "GC=F"
prefix   = "$"
decimals = 2

[[tile]]
key      = "wti"
label    = "WTI Crude"
group    = "Currencies & Commodities"
provider = "cnbc"
symbol   = "@CL.1"
alt_provider = "yahoo"
alt_symbol     = "CL=F"
prefix   = "$"
decimals = 2
good_when = "neutral"

[[tile]]
key      = "btc"
label    = "Bitcoin"
group    = "Currencies & Commodities"
provider = "coingecko"
symbol   = "bitcoin"
prefix   = "$"
decimals = 0
